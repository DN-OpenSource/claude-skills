<script>

  li.append(el("span", "n", String(i + 1)), el("span", null, c.text), st); $("criteria").append(li);
});

/* data shared by tabs */
const T = D.tests || {}; const rows = arr(T.rows);

/* tabs */

/* overview */

  head.addEventListener("click", () => { const o = sec.dataset.open !== "true"; sec.dataset.open = String(o); head.setAttribute("aria-expanded", String(o)); });
  sec.append(head, body); return [sec, body];
}
const ov = $("panel-overview");
const vetoed = decisions.filter(x => x.veto); const unmerged = decisions.filter(x => x.pr && x.pr.label && !x.pr.merged);
const groups = [
  ["Vetoes", ST.fail, vetoed.map(x => [x.id + " " + x.title, (x.veto.by || "") + ": " + (x.veto.reason || "")]), "decisions", "Decisions"],
  ["Open questions", "var(--color-accent)", questions.map(q => [q.q, q.context || ""]), "roadmap", "Roadmap"],
  ["Unmerged PRs", "var(--color-neutral-700)", unmerged.map(x => ["PR " + x.pr.label, x.id + " " + x.title]), "decisions", "Decisions"]
].filter(g => g[2].length);

    h.append(d, el("span", "label", title), cnt); g.append(h);

    const btn = el("button", "btn btn-ghost", go + " →"); btn.type = "button"; btn.style.alignSelf = "flex-start"; btn.addEventListener("click", () => show(tab)); g.append(btn);

}
{

{

/* tests */

/* features */
{
  const p = $("panel-features"); const head = el("div", "panel-head"); const t = el("div");
  const flagged = features.filter(f => f.flag).length;
  const sum = el("p", "muted", featuresDone + " of " + features.length + " features done and linked to the goal. " + flagged + " flagged orphan or dead."); sum.style.fontSize = "14px";
  t.append(el("h2", null, "Feature map"), sum); head.append(t);
  const seg = el("div", "seg"); seg.setAttribute("role", "group"); seg.setAttribute("aria-label", "Feature view");
  const list = el("div", "table-wrap"); const table = el("table"); table.style.minWidth = "900px";
  const thead = el("thead"); const hr = el("tr"); for (const h of ["Feature", "Status", "Depends on", "Used by", "How it serves the goal"]) hr.append(el("th", null, h)); thead.append(hr);
  const tbody = el("tbody"); table.append(thead, tbody); list.append(table);
  const chips = xs => { const c = el("div", "chips"); if (!arr(xs).length) c.append(el("span", "muted", "—")); for (const x of arr(xs)) c.append(el("span", "tag tag-neutral", x)); return c; };
  for (const f of features) {
    const tr = el("tr"); const name = el("td"); name.style.cssText = "font-weight:600;white-space:nowrap";
    const nd = el("div"); nd.style.cssText = "display:flex;align-items:center;gap:8px"; nd.append(f.name);
    if (f.flag) { const fl = el("span", "tag", f.flag); fl.style.cssText = "border:1px dashed var(--st-fail);color:var(--st-fail);font-weight:400"; nd.append(fl); }
    name.append(nd);
    const st = el("td"); st.append(state(f.status || "", FST[f.status] || ST.blocked)); st.firstChild.style.fontWeight = "400";
    const d1 = el("td"); d1.append(chips(f.dependsOn)); const d2 = el("td"); d2.append(chips(f.usedBy));
    const sg = el("td", null, f.servesGoal || ""); sg.style.fontSize = "13.5px";
    tr.append(name, st, d1, d2, sg); tbody.append(tr);
  }
  // dependency graph: one column per dependency depth
  const graphBox = el("div", "graph-box"); graphBox.hidden = true;
  const byName = Object.fromEntries(features.map(f => [f.name, f])); const depth = {};
  const dep = (n, seen) => { if (depth[n] != null) return depth[n]; if (seen[n]) return 0; seen[n] = 1; const f = byName[n];
    const ds = f ? arr(f.dependsOn).filter(x => byName[x]) : []; depth[n] = ds.length ? 1 + Math.max(...ds.map(x => dep(x, seen))) : 0; return depth[n]; };
  features.forEach(f => dep(f.name, {}));
  const W = 152, NH = 54, G = 54, RG = 18; const cols = {};
  features.forEach(f => { (cols[depth[f.name]] = cols[depth[f.name]] || []).push(f); });
  const colList = Object.values(cols); const maxRows = Math.max(1, ...colList.map(c => c.length)); const ncols = Math.max(1, colList.length);
  const totalH = maxRows * NH + (maxRows - 1) * RG; const gw = ncols * W + (ncols - 1) * G; const pos = {};
  Object.entries(cols).forEach(([c, lst]) => { const colH = lst.length * NH + (lst.length - 1) * RG, off = (totalH - colH) / 2;
    lst.forEach((f, i) => { pos[f.name] = { x: c * (W + G), y: off + i * (NH + RG) }; }); });
  const graph = el("div", "graph"); graph.style.width = gw + "px"; graph.style.height = totalH + "px";
  const gs = svg("svg", { width: gw, height: totalH, "aria-hidden": "true" });
  features.forEach(f => arr(f.dependsOn).forEach(x => { if (!pos[x]) return; const a = pos[x], b = pos[f.name];
    const x1 = a.x + W, y1 = a.y + NH / 2, x2 = b.x, y2 = b.y + NH / 2, m = (x2 - x1) / 2;
    gs.append(svg("path", { d: "M" + x1 + " " + y1 + " C" + (x1 + m) + " " + y1 + ", " + (x2 - m) + " " + y2 + ", " + x2 + " " + y2, fill: "none", stroke: "var(--color-neutral-400)", "stroke-width": 1.2 })); }));
  graph.append(gs);
  for (const f of features) { const nd = el("div", "node"); const col = f.flag ? ST.fail : (FST[f.status] || ST.blocked);
    nd.style.cssText = "left:" + pos[f.name].x + "px;top:" + pos[f.name].y + "px;width:" + W + "px;height:" + NH + "px;border-color:" + col + ";border-style:" + (f.flag ? "dashed" : "solid");
    const sub = el("span", null, f.flag ? f.status + " · " + f.flag : f.status); sub.style.color = col; nd.append(el("b", null, f.name), sub); graph.append(nd); }
  const legend = el("div", "legend");
  for (const [label, color, style] of [["Done", ST.pass, "solid"], ["In progress", ST.flaky, "solid"], ["Orphan / dead", ST.fail, "dashed"], ["Arrows point from dependency to user", "var(--color-neutral-400)", "solid"]]) {
    const s = el("span"); const i = el("i"); i.style.borderColor = color; i.style.borderStyle = style; s.append(i, label); legend.append(s); }
  graphBox.append(graph, legend);
  for (const [k, label] of [["list", "List"], ["graph", "Graph"]]) {
    const b = el("button", null, label); b.type = "button"; b.setAttribute("aria-pressed", String(k === "list"));
    b.addEventListener("click", () => { seg.querySelectorAll("button").forEach(x => x.setAttribute("aria-pressed", String(x === b))); list.hidden = k !== "list"; graphBox.hidden = k !== "graph"; });
    seg.append(b);
  }
  if (features.length) head.append(seg);
  p.append(head); if (features.length) p.append(list, graphBox); else none(p);
}

/* roadmap */
{

      for (let i = 1; i <= 3; i++) { const b = el("i"); if (i <= w) b.style.background = color; bars.append(b); }

  else { const ol = el("ol"); questions.forEach((q, i) => { const li = el("li"); const d = el("div"); const qq = el("div", null, q.q); qq.style.cssText = "font-size:15px;font-weight:600";
    const cx = el("div", "muted", q.context || ""); cx.style.cssText = "font-size:13px;margin-top:2px"; d.append(qq, cx); li.append(el("span", "n", String(i + 1)), d); ol.append(li); }); qs.append(ol); }

/* decisions */
{
  const p = $("panel-decisions"); p.append(el("h2", null, "Decisions"));
  const list = el("div", "decisions");
  const SC = { accepted: ST.pass, done: ST.pass, vetoed: ST.fail, open: "var(--color-accent)", proposed: "var(--color-accent)", rejected: "var(--color-neutral-600)", failed: ST.fail };
  for (const x of decisions) {
    const v = x.votes || {}; const seq = [];
    for (let i = 0; i < (v.for || 0); i++) seq.push("for"); for (let i = 0; i < (v.against || 0); i++) seq.push("against"); for (let i = 0; i < (v.abstain || 0); i++) seq.push("abstain");

    const head = el("button", "dec-head"); head.type = "button"; head.setAttribute("aria-expanded", "false");
    const left = el("div"); left.style.minWidth = "0"; const meta = el("div", "dec-meta");
    const idEl = el("span", "mono muted", x.id); idEl.style.fontSize = "12px";
    const sc = SC[x.status] || muted; const stTag = el("span", "tag", x.status || ""); stTag.style.border = "1px solid " + sc; stTag.style.color = sc;
    meta.append(idEl, stTag); if (x.pr && x.pr.label) meta.append(el("span", "muted", "PR " + x.pr.label + " · " + (x.pr.merged ? "merged" : "not merged")));
    left.append(meta, el("div", "dec-title", x.title));
    const votes = el("div", "votes"); const seats = el("div", "seats"); seats.setAttribute("aria-hidden", "true");
    for (let i = 0; i < 9; i++) { const s = el("i");
      if (i >= (x.panel || 0)) { s.style.borderStyle = "dashed"; s.style.borderColor = "var(--color-divider)"; }
      else { const kind = seq[i] || "abstain"; const c = kind === "for" ? ST.pass : kind === "against" ? ST.fail : "var(--color-neutral-600)";
        s.style.borderColor = c; if (kind !== "abstain") s.style.background = c; }
      seats.append(s); }
    const vt = el("div"); vt.style.cssText = "display:grid;gap:2px"; const scale = el("div", "scale");
    for (const n of [3, 6, 9]) scale.append(el("span", n === Number(x.panel) ? "on" : null, String(n)));
    vt.append(scale, el("span", "vote-text", (v.for || 0) + " for · " + (v.against || 0) + " against · " + (v.abstain || 0) + " abstain"));
    votes.append(seats, vt); head.append(left, votes, chev());
    const body = el("div", "dec-body");
    if (x.veto) { const ve = el("div", "veto"); ve.append(el("b", null, "Vetoed by " + (x.veto.by || "a panel member") + ". "), clean(x.veto.reason)); body.append(ve); }
    const args = el("div", "args");
    for (const [label, text, color] of [["Winning argument", x.winning, ST.pass], ["Strongest dissent", x.dissent, ST.fail]]) {
      const a = el("div"); const lb = el("div", "label", label); lb.style.color = color; a.append(lb, el("p", null, text || "—")); args.append(a); }
    body.append(args);
    const foot = el("div", "dec-foot");
    const pn = el("div"); pn.append(el("div", "label", "Panel"), el("div", null, (x.panel || "—") + " members, " + (x.rounds || "—") + " round" + (Number(x.rounds) === 1 ? "" : "s"))); pn.lastChild.style.marginTop = "4px";
    const vp = el("div"); vp.style.cssText = "flex:1;min-width:240px"; const vpc = el("div", "chips"); vpc.style.marginTop = "6px";
    for (const s of arr(x.viewpoints)) vpc.append(el("span", "tag tag-neutral", s)); vp.append(el("div", "label", "Viewpoints"), vpc);
    foot.append(pn, vp);
    const url = x.pr && safeUrl(x.pr.url); if (url) { const a = el("a", "btn btn-primary", "Open PR " + (x.pr.label || "")); a.href = url; a.style.whiteSpace = "nowrap"; foot.append(a); }
    body.append(foot);
    head.addEventListener("click", () => { const o = art.dataset.open !== "true"; art.dataset.open = String(o); head.setAttribute("aria-expanded", String(o)); });
    art.append(head, body); list.append(art);
  }
  if (decisions.length) {
    p.append(list);
    const lg = el("div", "vote-legend");
    for (const [label, color, fill, style] of [["For", ST.pass, true, "solid"], ["Against", ST.fail, true, "solid"], ["Abstain", "var(--color-neutral-600)", false, "solid"], ["Seat not used (panel of 3 / 6 / 9)", "var(--color-divider)", false, "dashed"]]) {
      const s = el("span"); const i = el("i"); i.style.borderColor = color; i.style.borderStyle = style; if (fill) i.style.background = color; s.append(i, label); lg.append(s); }
    p.append(lg);
  } else none(p);
}
